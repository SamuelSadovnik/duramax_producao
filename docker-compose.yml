# Postgres para desenvolvimento local. Em produção o banco é o Neon.
services:
  db:
    image: postgres:16-alpine
    container_name: duramax_producao_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: duramax
      POSTGRES_PASSWORD: duramax
      POSTGRES_DB: duramax_producao
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - dados_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duramax -d duramax_producao"]
      interval: 5s
      retries: 10
volumes:
  dados_pg:
